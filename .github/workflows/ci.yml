# The full run, for every push to trunk in batches, and for every pull
# request: on each system, after installing the tools and the bundle, the
# packages the test fixtures lock (rake fixtures), a setup step that no
# test task runs. On Linux bin/setup does all of it, and the macOS and
# Windows jobs run its steps themselves, since they install fewer of
# mise.toml's tools than it does. Then on Linux, the whole of rake check (rbs
# validate, the comment on every public part of sig/, Steep, the tests
# with their coverage, the tests under RBS's runtime type checker, every
# Ruby example in the documentation, CrossLint's own check of this
# repository, usage lint, the check that docs/reference/cli.md is what
# usage generates, and REUSE), which fast.yml also runs on every push of
# its own; and on macOS and Windows the tests, each with the Ruby, the
# Node, and tools mise.toml pins. The macOS and Windows jobs leave out the
# Gemfile's check group, which only rake check uses.
#
# On trunk one run goes and one waits, and a newer push replaces the run
# that waits and never the one that goes, so every run that starts
# finishes, and it proves the commit at its head. A release is a commit
# that heads a run of this workflow that passed
# (.github/scripts/check-ci-passed.sh).

name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

# On trunk every push is in one group, which holds one run going and one
# waiting: GitHub replaces the waiting run with a newer push's, and
# cancels the run going only when cancel-in-progress is true. On a branch
# a push cancels the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

defaults:
  run:
    shell: bash

env:
  # A missing precompiled Ruby fails the job instead of compiling one.
  MISE_RUBY_COMPILE: "false"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # mise's own timeouts, 20 s to fetch the list of remote versions and 30 s
  # for a request, cut off the Ruby download on a slow runner ("timed out
  # after 20.00s"); the job's timeout-minutes did not end it.
  MISE_HTTP_TIMEOUT: 120s
  MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 120s

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/crosslint/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crosslint/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Set up
        run: bin/setup

      - name: Run every check
        run: bundle exec rake check

  test-macos:
    name: Tests (macOS)
    runs-on: macos-15
    timeout-minutes: 20
    env:
      BUNDLE_WITHOUT: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: ruby node

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/crosslint/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crosslint/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Install the bundle
        run: bundle install

      - name: Install the test fixtures' packages
        run: bundle exec rake fixtures

      - name: Run the tests
        run: bundle exec rake test

  # Windows' Ruby is RubyInstaller's, with the DLLs and the MSYS2 its gems
  # compile with, all from mise.toml.
  test-windows:
    name: Tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      BUNDLE_WITHOUT: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11
          install_args: http:rubyinstaller-head http:msys2-zlib http:msys2-libgcc http:msys2 node
          add_shims_to_path: false
          mise_dir: ${{ runner.temp }}\mise

      - name: Give Windows' Ruby the rest of its environment
        run: .github/scripts/windows-ruby-env.sh

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$RUNNER_TEMP/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock', 'mise.toml') }}

      - name: Install the bundle
        run: bundle install

      - name: Install the test fixtures' packages
        run: bundle exec rake fixtures

      - name: Run the tests
        run: bundle exec rake test
