# The fast tier: on every push to trunk and every pull request, on Linux,
# after bin/setup installs the tools, the bundle, and the packages the test
# fixtures lock (rake fixtures), the whole of rake check (RuboCop, rbs
# validate, the comment on every public part of sig/, Steep, the tests
# with their coverage, the tests under RBS's runtime type checker, every
# Ruby example in the documentation, CrossLint's own check of this
# repository, usage lint, the check that docs/reference/cli.md is what
# usage generates, and REUSE), so that each push to trunk gets a verdict
# of its own. ci.yml's full run, which adds the tests on macOS and
# Windows, covers the pushes in batches.
#
# It is a workflow of its own because GitHub ends a run, and gh run list
# reports its conclusion, only when the run's slowest job ends, and a
# macOS or Windows runner can start long after a Linux one.

name: Fast

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

# On trunk every push has a group of its own, named for its commit, so no
# push cancels or replaces another's run and each commit gets a verdict.
# On a branch a push cancels the run before it.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
    github.ref == 'refs/heads/trunk' && github.sha || 'branch' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

defaults:
  run:
    shell: bash

env:
  # A missing precompiled Ruby fails the job instead of compiling one.
  MISE_RUBY_COMPILE: "false"
  # Install exactly what Gemfile.lock locks, or fail.
  BUNDLE_FROZEN: "true"
  # mise's own timeouts, 20 s to fetch the list of remote versions and 30 s
  # for a request, cut off the Ruby download on a slow runner ("timed out
  # after 20.00s"); the job's timeout-minutes did not end it.
  MISE_HTTP_TIMEOUT: 120s
  MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 120s

jobs:
  check:
    name: Check (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          cache_save: ${{ github.ref == 'refs/heads/trunk' }}
          version: 2026.10.11

      - name: Place Bundler outside the checkout
        id: paths
        run: |
          echo "BUNDLE_PATH=$HOME/.cache/crosslint/bundle" >> "$GITHUB_ENV"
          echo "ruby=$(ruby -e 'print RUBY_VERSION, "-", RUBY_REVISION, "-", RUBY_PLATFORM')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/crosslint/bundle
          key: gems-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.ruby }}-${{ hashFiles('Gemfile.lock') }}

      - name: Set up
        run: bin/setup

      - name: Run every check
        run: bundle exec rake check
