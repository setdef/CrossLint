# Standard (rake standard) checks the style of every Ruby file, as Ruby
# 3.3. The code was kept to 3.3's syntax for mutant, which is gone (#23);
# targeting the Ruby that mise.toml pins finds offenses of newer style,
# such as blocks that could use `it`, so the target moves when they're
# fixed.
ruby_version: 3.3
ignore:
  - ".scratch/**/*"
  - "build/dist/**/*"
  # Layout/EndOfLine is "native", which on Windows demands CRLF. Every text
  # file is LF on every system (.gitattributes), so the cop has nothing to
  # check, and it would refuse every file there.
  - "**/*":
      - Layout/EndOfLine
