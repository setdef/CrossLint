# Standard (rake standard) checks the style of every Ruby file, for
# Ruby 3.3's syntax: mutant's parser reads no later syntax, and every
# change is mutation-tested (docs/design/architecture.md).
ruby_version: 3.3
ignore:
  - ".scratch/**/*"
  - "build/dist/**/*"
  # Layout/EndOfLine is "native", which on Windows demands CRLF. Every text
  # file is LF on every system (.gitattributes), so the cop has nothing to
  # check, and it would refuse every file there.
  - "**/*":
      - Layout/EndOfLine
