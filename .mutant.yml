# Mutation testing (rake mutant): mutant changes lib/ in one place at a
# time, and a test must fail for each change. Mutant is free for open-source
# projects, which CrossLint is.
usage: opensource
integration:
  name: minitest
includes:
  - lib
  - test
requires:
  - cross_lint
  - cross_lint/testing
# The contract tests in CrossLint::Testing are tests themselves: the
# adapters' tests run them, and no test covers them.
matcher:
  subjects:
    - CrossLint*
  ignore:
    - CrossLint::Testing*
    # Windows alone runs the job object, and mutant doesn't run there.
    - CrossLint::Adapters::JobObject*
